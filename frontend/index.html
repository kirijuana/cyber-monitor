<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кибер Стратегия - Мониторинг безопасности</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Prosto+One&family=Play:wght@400;700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Фоновый паттерн (шестигранники) -->
    <div class="bg-pattern"></div>

    <!-- Шапка -->
    <header class="header">
        <div class="logo-container">
            <div class="logo-icon">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <polygon points="50,5 95,27.5 95,72.5 50,95 5,72.5 5,27.5"
                             fill="none" stroke="#EF233C" stroke-width="2"/>
                    <rect x="40" y="40" width="20" height="20" fill="#EF233C"/>
                </svg>
            </div>
            <h1 class="logo-text">КИБЕР СТРАТЕГИЯ</h1>
        </div>
        <div class="datetime">
            <div class="time" id="current-time">--:--:--</div>
            <div class="date" id="current-date">-- -- --</div>
        </div>
    </header>

    <!-- Основная статистика -->
    <section class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon protected">🛡️</div>
            <div class="stat-value" id="protected-count">0</div>
            <div class="stat-label">Защищено</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon warning">⚠️</div>
            <div class="stat-value" id="warning-count">0</div>
            <div class="stat-label">Требуют внимания</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon critical">🚨</div>
            <div class="stat-value" id="critical-count">0</div>
            <div class="stat-label">Критические</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon threats">⚡</div>
            <div class="stat-value" id="threats-count">0</div>
            <div class="stat-label">Угроз заблокировано</div>
        </div>
    </section>

    <!-- Детальная информация -->
    <section class="details-grid">
        <!-- Устройства -->
        <div class="detail-panel">
            <h2 class="panel-title">Устройства</h2>
            <div class="device-list" id="device-list">
                <!-- Заполняется через JS -->
            </div>
        </div>

        <!-- Сервисы -->
        <div class="detail-panel">
            <h2 class="panel-title">Сервисы</h2>
            <div class="service-list" id="service-list">
                <!-- Заполняется через JS -->
            </div>
        </div>
    </section>

    <!-- Статус подключения -->
    <div class="connection-status" id="connection-status">
        <span class="status-dot"></span>
        <span class="status-text">Подключение...</span>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
